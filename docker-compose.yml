services:
  identity-provider:
    build:
      context: ./identity-provider
      dockerfile: Dockerfile
    container_name: identity-provider
    ports:
      - "3001:3001"
    environment:
      JWT_SECRET: supersecret2026
      REDIS_URL: redis://redis:6379
      PORT: 3001
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cafeteria_net

  student-ui:
    build:
      context: ./student-ui
      dockerfile: Dockerfile
    container_name: student-ui
    ports:
      - "3004:3004"
    environment:
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:3000
      NEXT_PUBLIC_IDENTITY_URL: http://localhost:3001
      NEXT_PUBLIC_HUB_URL: http://localhost:3003
      NEXT_PUBLIC_KITCHEN_QUEUE_URL: http://localhost:3005
      NEXT_PUBLIC_STOCK_SERVICE_URL: http://localhost:3002
      PORT: 3004
    depends_on:
      identity-provider:
        condition: service_started
    networks:
      - cafeteria_net

  order-gateway:
    build:
      context: ./order-gateway
      dockerfile: Dockerfile
    container_name: order-gateway
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: supersecret2026
      REDIS_URL: redis://redis:6379
      STOCK_SERVICE_URL: http://stock-service:3002
      PORT: 3000
      NODE_ENV: production
      QUEUE_NAME: cook_order
      CHAOS_ENABLED: "false"
    depends_on:
      identity-provider:
        condition: service_started
      redis:
        condition: service_healthy
      stock-service:
        condition: service_started
    networks:
      - cafeteria_net

  stock-service:
    build:
      context: ./stock-service
      dockerfile: Dockerfile
    container_name: stock-service
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgres://user:pass@db:5432/cafeteria
      REDIS_URL: redis://redis:6379
      PORT: 3002
      NODE_ENV: production
      CHAOS_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cafeteria_net

  kitchen-queue:
    build:
      context: ./kitchen-queue
      dockerfile: Dockerfile
    container_name: kitchen-queue
    ports:
      - "3005:3005"
    environment:
      REDIS_URL: redis://redis:6379
      NOTIFICATION_HUB_URL: http://notification-hub:3003
      QUEUE_NAME: cook_order
      NODE_ENV: production
      PORT: 3005
      CHAOS_ENABLED: "false"
    depends_on:
      redis:
        condition: service_healthy
      notification-hub:
        condition: service_started
    networks:
      - cafeteria_net

  notification-hub:
    build:
      context: ./notification-hub
      dockerfile: Dockerfile
    container_name: notification-hub
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3004
    networks:
      - cafeteria_net

  db:
    image: postgres:16-alpine
    container_name: db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: cafeteria
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d cafeteria"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - cafeteria_net

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cafeteria_net

networks:
  cafeteria_net:
    driver: bridge

volumes:
  postgres_data:
